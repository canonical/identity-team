name: image scan
run-name: Scanning image ${{ inputs.image }}

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
        description: "image to scan"
      exit-code:
        type: string
        required: false
        default: "0"
        description: "Exit code when vulnerabilities are found ('1' to fail on CVEs, '0' to report only)"
      severity:
        type: string
        required: false
        default: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
        description: "Severities of CVEs to evaluate (note: unselected severities will be omitted from the uploaded SARIF report)"
      ignore-unfixed:
        type: boolean
        required: false
        default: false
        description: "Ignore unpatched CVEs without available upstream fixes"
      trivyignores:
        type: string
        required: false
        default: ""
        description: "Path to .trivyignore file"
jobs:
  scan:
    permissions:
      packages: read
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: ${{ inputs.trivyignores != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.exit-code }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          trivyignores: ${{ inputs.trivyignores }}

      - name: Upload scan results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: 'trivy-results.sarif'
