name: build
run-name: Build steps for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      structure-tests-enabled:
        type: boolean
        default: false
        required: false
        description: "Flag defining if structure tests are present"
      ignore-restrictions:
        type: string
        default: ""
        required: false
        description: "Comma separated list of ignored restrictions (e.g. 'unmaintained')"
      architecture:
        type: string
        default: ""
        required: false
        description: "[deprecated, use 'architectures' with an 's'] Target architecture"
      architectures:
        type: string
        default: '["amd64"]'
        required: false
        description: 'JSON array string of target architectures (e.g. ["amd64", "arm64"])'
      runner:
        type: string
        default: ""
        required: false
        description: "Override the runner to run on. If empty, standard native runners are used."
    outputs:
      rock:
        description: "rock image"
        value: ${{ jobs.build.outputs.rock }}

jobs:
  build:
    name: Build (${{ matrix.architecture }})
    strategy:
      matrix:
        architecture: ${{ inputs.architecture != '' && fromJSON(format('["{0}"]', inputs.architecture)) || fromJSON(inputs.architectures) }}
    runs-on: ${{ inputs.runner != '' && inputs.runner || (matrix.architecture == 'arm64' && 'self-hosted-linux-arm64-noble-medium' || 'ubuntu-24.04') }}
    outputs:
      rock: ${{ steps.rockcraft.outputs.rock }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: canonical/craft-actions/rockcraft/pack@acd2f2e61c7563b38ba89390ca0e910fa7d2784f # v0.1.1
        id: rockcraft
        with:
          ignore: ${{ inputs.ignore-restrictions }}

      - name: Install Rockcraft to get Skopeo
        run: sudo snap install --classic --channel latest/stable rockcraft

      - name: Install Skaffold and Container Structure Tests tools
        if: inputs.structure-tests-enabled == true
        run: |
          mkdir -p bin/
          curl -Lo bin/container-structure-test "https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-${{ matrix.architecture }}"
          chmod +x bin/container-structure-test
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Run container structural tests
        if: inputs.structure-tests-enabled == true
        run: |
          # docker-daemon avoids the push to the remote registry
          sudo rockcraft.skopeo --insecure-policy copy oci-archive:$(realpath ./"${{ steps.rockcraft.outputs.rock }}") docker-daemon:ghcr.io/${{ github.repository }}:${{ github.sha }} --dest-creds ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
          container-structure-test test -c structure-tests.yaml -i ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Generate SBOMs (Software Bill of Materials)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft ${{ steps.rockcraft.outputs.rock }} -o spdx-json=${{ steps.rockcraft.outputs.rock }}.sbom.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.rockcraft.outputs.rock }}-sbom
          path: "${{ steps.rockcraft.outputs.rock }}.sbom.json"

      - name: Upload rock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.rockcraft.outputs.rock }}
          path: ${{ steps.rockcraft.outputs.rock }}

  # Consolidated status check for all build jobs that fails if any architecture build job fails.
  # This provides a static check context name ("ci / build / Build") for branch protection rules.
  status-check:
    name: Build
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed with status: ${{ needs.build.result }}"
            exit 1
          fi
