name: OpenSpec Archive

on:
  workflow_call:
    secrets:
      PAT_TOKEN:
        description: Optional PAT to push archival commits and re-trigger CI checks
        required: false

jobs:
  openspec-archive:
    name: OpenSpec Archive
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/archive-spec') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Guard Merged or Closed PR
        id: pr_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          STATE=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          if [ "$STATE" != "OPEN" ]; then
            gh pr comment "$PR_NUMBER" \
              --body "ℹ️ **OpenSpec Archive**: this PR is ${STATE} — cannot archive changes on a non-open PR." || true
          fi

      - name: Checkout Repository
        if: steps.pr_state.outputs.state == 'OPEN'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout PR Branch
        if: steps.pr_state.outputs.state == 'OPEN'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr checkout "$PR_NUMBER"

      - name: Check OpenSpec Adoption
        if: steps.pr_state.outputs.state == 'OPEN'
        id: check_openspec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ ! -d "openspec" ]; then
            echo "has_openspec=false" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" \
              --body "⚠️ **OpenSpec Archive**: Repository has not initialized an \`openspec/\` directory."
          else
            echo "has_openspec=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check_openspec.outputs.has_openspec == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenSpec CLI
        if: steps.check_openspec.outputs.has_openspec == 'true'
        run: npm install --global @fission-ai/openspec@latest

      - name: Discover Active OpenSpec Changes
        if: steps.check_openspec.outputs.has_openspec == 'true'
        id: discover
        run: |
          CHANGES_JSON=$(openspec list --json)
          ACTIVE_CHANGES=$(echo "$CHANGES_JSON" | jq -r '(.changes // []) | map(.name) | join(" ")')

          if [ -z "$ACTIVE_CHANGES" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "changes=$ACTIVE_CHANGES" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify No Active Changes
        if: steps.check_openspec.outputs.has_openspec == 'true' && steps.discover.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "⚠️ **OpenSpec Archive**: No active OpenSpec changes found to archive."

      - name: Verify Task Completion (tasks.md)
        if: steps.check_openspec.outputs.has_openspec == 'true' && steps.discover.outputs.has_changes == 'true'
        env:
          CHANGES: ${{ steps.discover.outputs.changes }}
        run: |
          for CHANGE in $CHANGES; do
            TASKS_FILE="openspec/changes/$CHANGE/tasks.md"
            if [ -f "$TASKS_FILE" ]; then
              INCOMPLETE=$(grep -Ec '^[[:space:]]*([-*+]|[0-9]+\.)[[:space:]]+\[[[:space:]]\]' "$TASKS_FILE" || true)
              if [ "$INCOMPLETE" -gt 0 ]; then
                echo "ERROR_MSG=Change **\`$CHANGE\`**: Has **$INCOMPLETE** incomplete task(s) remaining in \`tasks.md\`." >> "$GITHUB_ENV"
                exit 1
              fi
            fi
          done

      - name: Validate OpenSpec Schemas
        if: steps.check_openspec.outputs.has_openspec == 'true' && steps.discover.outputs.has_changes == 'true'
        env:
          CHANGES: ${{ steps.discover.outputs.changes }}
        run: |
          for CHANGE in $CHANGES; do
            if ! openspec validate "$CHANGE" --strict; then
              echo "ERROR_MSG=Change **\`$CHANGE\`**: Failed OpenSpec schema validation." >> "$GITHUB_ENV"
              exit 1
            fi
          done

      - name: Execute OpenSpec Archive
        if: steps.check_openspec.outputs.has_openspec == 'true' && steps.discover.outputs.has_changes == 'true'
        env:
          CHANGES: ${{ steps.discover.outputs.changes }}
        run: |
          for CHANGE in $CHANGES; do
            if ! openspec archive "$CHANGE" --yes; then
              echo "ERROR_MSG=Change **\`$CHANGE\`**: Archival step failed during merge." >> "$GITHUB_ENV"
              exit 1
            fi
          done

      - name: Commit and Push Changes
        if: steps.check_openspec.outputs.has_openspec == 'true' && steps.discover.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add openspec/

          if ! git diff --cached --quiet; then
            git commit -m "chore(openspec): archive completed spec change"
            if ! git push origin HEAD; then
              echo "ERROR_MSG=Failed to push archival commit to the PR branch (branch may be out of date, protected, or from a fork)." >> "$GITHUB_ENV"
              exit 1
            fi
          fi

      - name: Post Success Comment
        if: steps.check_openspec.outputs.has_openspec == 'true' && steps.discover.outputs.has_changes == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "✅ **OpenSpec Archival Successful**: All tasks verified and changes merged into \`openspec/specs/\`."

      - name: Post Failure Comment
        if: steps.check_openspec.outputs.has_openspec == 'true' && steps.discover.outputs.has_changes == 'true' && failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ERROR_MSG: ${{ env.ERROR_MSG }}
        run: |
          BODY=$(printf "### ❌ OpenSpec Archival Paused\n\n%s\n\nPlease resolve the issue on your branch and reply with \`/archive-spec\` to try again." "${ERROR_MSG:-An error occurred during archival verification.}")
          gh pr comment "$PR_NUMBER" --body "$BODY"
