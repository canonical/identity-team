name: OpenSpec Pre-Merge Check

on:
  workflow_call:

jobs:
  check:
    name: OpenSpec Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check OpenSpec Adoption
        id: check_openspec
        run: |
          if [ ! -d "openspec" ]; then
            echo "has_openspec=false" >> "$GITHUB_OUTPUT"
            echo "No openspec/ directory found. Skipping OpenSpec check."
          else
            echo "has_openspec=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check_openspec.outputs.has_openspec == 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"

      - name: Install OpenSpec CLI
        if: steps.check_openspec.outputs.has_openspec == 'true'
        run: npm install --global @fission-ai/openspec@latest

      - name: Discover Active OpenSpec Changes
        if: steps.check_openspec.outputs.has_openspec == 'true'
        id: discover
        run: |
          CHANGES_JSON=$(openspec list --json)
          ACTIVE_CHANGES=$(echo "$CHANGES_JSON" | jq -r '(.changes // []) | map(.name) | join(" ")')

          if [ -z "$ACTIVE_CHANGES" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "changes=$ACTIVE_CHANGES" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Task Completion (tasks.md)
        if: steps.check_openspec.outputs.has_openspec == 'true' && steps.discover.outputs.has_changes == 'true'
        env:
          CHANGES: ${{ steps.discover.outputs.changes }}
        run: |
          FAIL_STEP=false
          for CHANGE in $CHANGES; do
            TASKS_FILE="openspec/changes/$CHANGE/tasks.md"
            if [ -f "$TASKS_FILE" ]; then
              INCOMPLETE=$(grep -Ec '^[[:space:]]*([-*+]|[0-9]+\.)[[:space:]]+\[[[:space:]]\]' "$TASKS_FILE" || true)
              if [ "$INCOMPLETE" -gt 0 ]; then
                echo "::error file=$TASKS_FILE::Change '$CHANGE' has $INCOMPLETE incomplete task(s) remaining in tasks.md."
                FAIL_STEP=true
              fi
            fi
          done
          if [ "$FAIL_STEP" = "true" ]; then
            exit 1
          fi

      - name: Validate OpenSpec Schemas
        if: steps.check_openspec.outputs.has_openspec == 'true'
        run: |
          if ! openspec validate --all --strict; then
            echo "::error::OpenSpec schema validation failed."
            exit 1
          fi

      - name: Verify No Active Changes Exist (Enforce Archival)
        if: steps.check_openspec.outputs.has_openspec == 'true' && steps.discover.outputs.has_changes == 'true'
        env:
          CHANGES: ${{ steps.discover.outputs.changes }}
        run: |
          echo "::error::Active OpenSpec changes found: $CHANGES. Active changes must be archived using the '/archive-spec' command before merging."
          exit 1
