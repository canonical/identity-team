name: Upstream upgrade tooling tests

on:
  push:
    branches:
      - main
    paths:
      - "tools/upstream-upgrade/**"
      - ".github/workflows/_rock-upstream-*.yaml"
      - ".github/workflows/upstream-upgrade-tests.yaml"
  pull_request:
    paths:
      - "tools/upstream-upgrade/**"
      - ".github/workflows/_rock-upstream-*.yaml"
      - ".github/workflows/upstream-upgrade-tests.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run unit tests
        run: python3 -m unittest discover -s tools/upstream-upgrade/tests -v
