name: Upstream upgrade tooling tests

on:
  push:
    branches:
      - main
    paths:
      - "tools/upstream-upgrade/**"
      - ".github/workflows/_rock-upstream-*.yaml"
      - ".github/workflows/upstream-upgrade-tests.yaml"
  pull_request:
    paths:
      - "tools/upstream-upgrade/**"
      - ".github/workflows/_rock-upstream-*.yaml"
      - ".github/workflows/upstream-upgrade-tests.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Run unit tests
        run: python3 -m unittest discover -s tools/upstream-upgrade/tests -v
